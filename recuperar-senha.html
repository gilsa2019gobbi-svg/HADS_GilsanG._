
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha | MsBarbearias</title>

    <link href="./assets/css/bootstrap.min.css" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <style>
        /* INICIO - ESTILO DA PAGINA */

        body {
            min-height: 100vh;
            background: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .recuperar-card {
            background: #ffffff;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .recuperar-logo {
            color: #ff3300;
            font-size: 27px;
            font-weight: 800;
            text-decoration: none;
        }

        .recuperar-logo span {
            color: #16232f;
        }

        .recuperar-logo:hover {
            text-decoration: none;
        }

        .recuperar-icone {
            font-size: 38px;
            color: #ff3300;
        }

        .recuperar-card h2 {
            font-size: 25px;
            font-weight: 700;
            color: #16232f;
        }

        .recuperar-card .form-control:focus {
            border-color: #ff3300;
            box-shadow: 0 0 0 0.2rem rgba(255, 51, 0, 0.12);
        }

        .btn-recuperar {
            background: #ff3300;
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
        }

        .btn-recuperar:hover {
            background: #d92b00;
            color: #ffffff;
        }

        .btn-recuperar:disabled {
            background: #ff7755;
            color: #ffffff;
            cursor: not-allowed;
        }

        .voltar-site {
            color: #16232f;
            font-size: 14px;
            text-decoration: none;
        }

        .voltar-site:hover {
            color: #ff3300;
        }

        @media (max-width: 480px) {
            .recuperar-card {
                padding: 28px 22px;
            }
        }

        /* FIM - ESTILO DA PAGINA */
    </style>
</head>

<body>

    <!-- INICIO - RECUPERAR SENHA -->

    <main class="recuperar-card">

        <!-- INICIO - LOGO -->

        <div class="text-center mb-4">

            <a href="./index.html" class="recuperar-logo">
                Ms<span>Barbearias.</span>
            </a>

        </div>

        <!-- FIM - LOGO -->

        <!-- INICIO - TITULO -->

        <div class="text-center mb-4">

            <i class="bi bi-shield-lock recuperar-icone"></i>

            <h2 class="mt-3">Recuperar senha</h2>

            <p class="text-muted">
                Informe o e-mail cadastrado para receber
                um link de redefinição de senha.
            </p>

        </div>

        <!-- FIM - TITULO -->

        <!-- INICIO - FORMULARIO -->

        <form id="form-recuperar-senha">

            <div class="mb-3">

                <label
                    for="email-recuperacao"
                    class="form-label"
                >
                    E-mail cadastrado
                </label>

                <input
                    type="email"
                    id="email-recuperacao"
                    name="email"
                    class="form-control"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    maxlength="255"
                    required
                >

            </div>

            <button
                type="submit"
                id="btn-recuperar"
                class="btn btn-recuperar w-100"
            >
                <i class="bi bi-envelope me-2"></i>
                Enviar link de recuperação
            </button>

            <div
                id="mensagem-recuperacao"
                class="mt-3 d-none"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <!-- FIM - FORMULARIO -->

        <!-- INICIO - VOLTAR AO SITE -->

        <div class="text-center mt-4">

            <a href="./index.html" class="voltar-site">

                <i class="bi bi-arrow-left me-1"></i>
                Voltar ao site

            </a>

        </div>

        <!-- FIM - VOLTAR AO SITE -->

    </main>

    <!-- FIM - RECUPERAR SENHA -->

    <!-- INICIO - JAVASCRIPT -->

    <script src="./assets/js/recuperar-senha.js"></script>

    <!-- FIM - JAVASCRIPT -->

</body>
</html>
