
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">

    <title>Redefinir Senha | MsBarbearias</title>

    <link href="./assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background: #f4f5f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .redefinir-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .redefinir-logo {
            color: #ff3300;
            font-size: 27px;
            font-weight: 800;
            text-decoration: none;
        }

        .redefinir-logo span {
            color: #16232f;
        }

        .redefinir-icone {
            font-size: 38px;
            color: #ff3300;
        }

        .redefinir-card h2 {
            font-size: 25px;
            font-weight: 700;
            color: #16232f;
        }

        .form-control:focus {
            border-color: #ff3300;
            box-shadow: 0 0 0 0.2rem rgba(255, 51, 0, 0.12);
        }

        .btn-redefinir {
            background: #ff3300;
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 12px;
        }

        .btn-redefinir:hover {
            background: #d92b00;
            color: #ffffff;
        }

        .btn-redefinir:disabled {
            background: #ff7755;
            color: #ffffff;
        }

        .voltar-site {
            color: #16232f;
            font-size: 14px;
            text-decoration: none;
        }

        .voltar-site:hover {
            color: #ff3300;
        }

        @media (max-width: 480px) {
            .redefinir-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <!-- INICIO - REDEFINIR SENHA -->

    <main class="redefinir-card">

        <div class="text-center mb-4">
            <a href="./index.html" class="redefinir-logo">
                Ms<span>Barbearias.</span>
            </a>
        </div>

        <div class="text-center mb-4">

            <i class="bi bi-shield-lock redefinir-icone"></i>

            <h2 class="mt-3">Redefinir senha</h2>

            <p class="text-muted">
                Escolha uma nova senha para acessar
                sua conta no MsBarbearias.
            </p>

        </div>

        <!-- INICIO - FORMULARIO -->

        <form id="form-redefinir-senha">

            <div class="mb-3">
                <label for="nova-senha" class="form-label">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="nova-senha"
                    class="form-control"
                    placeholder="Digite sua nova senha"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                    required
                >

                <small class="text-muted">
                    Utilize entre 8 e 72 caracteres.
                </small>
            </div>

            <div class="mb-4">
                <label for="confirmar-senha" class="form-label">
                    Confirmar nova senha
                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    class="form-control"
                    placeholder="Confirme sua nova senha"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="72"
                    required
                >
            </div>

            <button
                type="submit"
                id="btn-redefinir"
                class="btn btn-redefinir w-100"
            >
                <i class="bi bi-check-circle me-2"></i>
                Salvar nova senha
            </button>

            <div
                id="mensagem-redefinicao"
                class="mt-3 d-none"
                role="status"
                aria-live="polite"
            ></div>

        </form>

        <!-- FIM - FORMULARIO -->

        <div class="text-center mt-4">
            <a href="./index.html" class="voltar-site">
                <i class="bi bi-arrow-left me-1"></i>
                Voltar ao site
            </a>
        </div>

    </main>

    <!-- FIM - REDEFINIR SENHA -->

    <script src="./assets/js/redefinir-senha.js"></script>

</body>
</html>
